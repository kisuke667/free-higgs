<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="description" content="Studio créatif IA — génération de films, images et vidéos par intelligence artificielle.">
<meta name="author" content="kisuke667">
<meta property="og:title" content="HIGGSFREE — Studio Créatif IA">
<meta property="og:description" content="Génération de films, images et vidéos par IA.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#060608">
<title>HIGGSFREE v13 — CINEMA STUDIO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ─══════════════════════════════════════════
   HIGGSFREE — CINEMA STUDIO v13
   Noir obsidienne · Lime électrique · Studio brut
   ─══════════════════════════════════════════ */
:root{
  --bg:#060608;
  --bg-soft:#0A0A0C;
  --panel:#111113;
  --panel-2:#17171A;
  --panel-3:#1E1E21;
  --line:rgba(255,255,255,0.07);
  --line-strong:rgba(255,255,255,0.13);
  --ink:#F2F0EB;
  --ink-2:#E8E6E1;
  --dim:#9A9AA0;
  --muted:#6B6B70;
  --faint:#3A3A3E;
  --accent:#E8FF42;
  --accent-2:#C8E600;
  --accent-ink:#060608;
  --accent-glow:0 0 0 1px rgba(232,255,66,0.18), 0 12px 40px rgba(232,255,66,0.14);
  --violet:#8B5CF6;
  --orange:#FF4D12;
  --ok:#22C55E;
  --er:#FF3B30;
  --mono:'JetBrains Mono', ui-monospace, monospace;
  --sans:'Inter', system-ui, -apple-system, sans-serif;
  --display:'Space Grotesk', Inter, system-ui, sans-serif;
  --radius:18px;
  --radius-sm:12px;
  --radius-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
::selection{background:var(--accent);color:var(--accent-ink)}
body{
  font:15px/1.6 var(--sans);
  color:var(--ink);
  background:var(--bg);
  min-height:100vh;
  padding-bottom:80px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
/* grain + grid */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(900px 600px at 18% 0%, rgba(232,255,66,0.07), transparent 60%),
    radial-gradient(1100px 700px at 92% 8%, rgba(139,92,246,0.09), transparent 55%),
    radial-gradient(800px 500px at 50% 100%, rgba(255,77,18,0.05), transparent 60%);
  pointer-events:none;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;opacity:.035;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
}
/* ── HEADER ── HIGGSFIELD STUDIO */
header{
  position:sticky;top:0;z-index:30;
  display:grid;grid-template-columns:auto 1fr auto;
  align-items:center;gap:18px;
  padding:14px 20px;
  background:rgba(6,6,8,0.82);
  backdrop-filter:blur(16px) saturate(1.2);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);
  border-bottom:1px solid var(--line);
}

/* 980 moved to HIGGSFIELD MOBILE */
/* deduped */.logo{
  display:flex;align-items:center;gap:12px;
  font-family:var(--display);font-weight:700;letter-spacing:-0.02em;line-height:0.9;
}
.logo-mark{
  width:36px;height:36px;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;
  font:800 14px var(--mono);letter-spacing:-0.04em;
}
.logo-type{line-height:1}
.logo-type b{font-size:17px;letter-spacing:-0.02em;color:var(--ink);font-weight:700}
.logo-type b span{color:var(--accent)}
.logo-type i{
  display:block;margin-top:2px;
  font:500 8.5px var(--mono);letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);font-style:normal
}
.ver{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 8px;border-radius:var(--radius-pill);
  background:var(--accent);color:var(--accent-ink);
  font:700 10px var(--mono);letter-spacing:0.06em;
}
.ver::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-ink);opacity:.7;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:.25}}
#steps{
  display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
  justify-self:center;max-width:100%;
}
#steps::-webkit-scrollbar{display:none}
.st{
  flex:none;
  font:600 10.5px var(--mono);letter-spacing:0.08em;text-transform:uppercase;
  padding:8px 12px;border-radius:var(--radius-pill);
  border:1px solid var(--line);background:transparent;color:var(--dim);
  cursor:pointer;transition:all .18s;white-space:nowrap;
}
.st:hover:not(:disabled){border-color:var(--line-strong);color:var(--ink);background:rgba(255,255,255,0.04)}
.st.ok{color:var(--ink-2);border-color:var(--line-strong);background:rgba(255,255,255,0.05)}
.st.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.st:disabled{opacity:.32;cursor:not-allowed}
.st.on:disabled{opacity:1}
.hb{display:flex;gap:8px;align-items:center;justify-self:end}
.hb .sm{
  width:36px;height:36px;padding:0;display:grid;place-items:center;
  border-radius:var(--radius-pill);font-size:14px;
}
#qchip{border-radius:var(--radius-pill);font:600 10px var(--mono);padding:6px 10px}
/* ── LAYOUT */
main{max-width:1240px;margin:0 auto;padding:32px 20px}
@media(max-width:700px){main{padding:20px 14px}}
/* ── HERO ── editorial */
.hero{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:28px;
  margin-bottom:20px;
  position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, rgba(232,255,66,0.45), transparent);
  opacity:.9;
}
.hero::after{
  content:"";position:absolute;inset:0;border-radius:var(--radius);
  border:1px solid rgba(255,255,255,0.03);pointer-events:none;
}
.hero-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;
}
.hero-kicker{
  display:inline-flex;align-items:center;gap:8px;
  font:600 10px var(--mono);letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);
}
.hero-kicker::before{content:"";width:22px;height:1px;background:var(--accent)}
.lab{
  font:600 10px var(--mono);letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);
}
h2{
  font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-0.03em;line-height:0.95;
  margin:8px 0 10px;color:var(--ink);
}
h2 b{color:var(--accent);font-weight:700}
@media(max-width:700px){h2{font-size:26px}}
h3{
  font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;
  margin:22px 0 8px;color:var(--ink-2);
}
p.sub{color:var(--dim);margin-bottom:14px;max-width:760px;font-size:14.5px;line-height:1.6}
/* ── GUIDES ── Higgsfield callout */
.guide{
  display:flex;gap:12px;align-items:flex-start;
  border:1px solid var(--line);border-left:3px solid var(--accent);
  background:rgba(255,255,255,0.03);
  padding:14px 16px;margin:14px 0 18px;border-radius:12px;
  font-size:13.5px;line-height:1.55;color:var(--ink-2);
}
.guide.go{border-left-color:var(--ok);background:rgba(34,197,94,0.08)}
.guide.er{border-left-color:var(--er);background:rgba(255,59,48,0.08);display:block}
.guide.wt{border-left-color:var(--orange);background:rgba(255,77,18,0.08)}
.guide b{color:var(--ink)}
/* ── INPUTS */
textarea,input[type=text],select{
  width:100%;font:13.5px var(--mono);line-height:1.5;
  padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  outline:0;transition:border-color .15s, box-shadow .15s, background .15s;
}
textarea::placeholder,input::placeholder{color:var(--muted)}
textarea:focus,input:focus,select:focus{
  border-color:rgba(232,255,66,0.45);background:var(--panel-3);
  box-shadow:0 0 0 4px rgba(232,255,66,0.10);
}
textarea{resize:vertical;min-height:78px;margin:6px 0}
label.f{display:block;margin:10px 0}
label.f span{display:block;margin-bottom:6px}
/* ── BUTTONS ── Higgsfield pill */
button,.btn{
  font:700 11px var(--mono);letter-spacing:0.08em;text-transform:uppercase;
  padding:11px 16px;border-radius:var(--radius-pill);
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:all .16s;white-space:nowrap;
}
button:hover:not(:disabled),.btn:hover{
  background:var(--ink);color:var(--bg);border-color:var(--ink);
  transform:translateY(-1px);
}
button:active:not(:disabled){transform:translateY(0)}
button:disabled{opacity:.34;cursor:not-allowed;transform:none}
.big{
  background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
  padding:14px 22px;font-size:12px;letter-spacing:0.10em;
  box-shadow:var(--accent-glow);
}
.big:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2);color:var(--accent-ink);box-shadow:0 0 0 1px rgba(232,255,66,0.22), 0 16px 40px rgba(232,255,66,0.18);transform:translateY(-2px)}
.sm{
  padding:7px 12px;font-size:10.5px;border-radius:var(--radius-pill);
}
.ft{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap;align-items:center}
/* ── CHIPS / PILLS */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{
  font:600 11px var(--mono);padding:6px 10px;border-radius:var(--radius-pill);
  border:1px solid rgba(34,197,94,0.22);background:rgba(34,197,94,0.10);color:#86EFAC;
}
.chip.off{border-color:rgba(255,59,48,0.22);background:rgba(255,59,48,0.10);color:#FDA4A0}
.chip.cd{border-color:rgba(255,77,18,0.22);background:rgba(255,77,18,0.10);color:#FFB18A}
/* ── GENRE GRID */
.gc{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.gc button{
  padding:9px 13px;border-radius:var(--radius-pill);font-size:11.5px;
  background:var(--panel-2);border-color:var(--line);color:var(--dim);
}
.gc button.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:14px 0}
.ch{
  border:1px solid var(--line);padding:20px;border-radius:16px;
  cursor:pointer;background:var(--panel);transition:all .18s;
}
.ch:hover{border-color:var(--line-strong);background:var(--panel-2);transform:translateY(-2px)}
.ch.sel{border-color:var(--accent);background:rgba(232,255,66,0.06);box-shadow:0 0 0 1px rgba(232,255,66,0.18)}
.ch b{display:block;font:700 15px var(--display);margin-bottom:6px;color:var(--ink)}
/* ── CARD GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.cd{
  border:1px solid var(--line);background:var(--panel);padding:14px;
  border-radius:18px;position:relative;transition:all .18s;
}
.cd:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,0.35)}
.cd.pk{border-color:rgba(232,255,66,0.28);box-shadow:0 0 0 1px rgba(232,255,66,0.12), 0 10px 30px rgba(0,0,0,0.3)}
.im{
  position:relative;background:#0B0B0D;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  margin-bottom:10px;border-radius:14px;
  font:10px var(--mono);color:var(--muted);
  border:1px solid var(--line);
}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.im::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, transparent 62%, rgba(0,0,0,0.55) 100%);
  pointer-events:none;
}
.sp,.sp2{border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:r 1s linear infinite}
.sp{position:absolute;width:28px;height:28px;z-index:2}
.sp2{display:inline-block;width:16px;height:16px;flex:none}
@keyframes r{to{transform:rotate(360deg)}}
.ip{
  background:var(--panel-2);border:1px solid var(--line);
  padding:10px;margin:10px 0;border-radius:12px;
}
.ip input{margin-bottom:8px}
.rw{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.up{border:1px solid var(--line);cursor:pointer;border-radius:var(--radius-pill)}
.bar{height:6px;background:rgba(255,255,255,0.08);margin:16px 0;border-radius:var(--radius-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s;border-radius:var(--radius-pill)}
.feed{margin:12px 0}
.fi{
  display:flex;gap:12px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line);
  font-size:13px;color:var(--ink-2);
}
.fi.ok{color:var(--ink)}
.fi.er{color:var(--er)}
.fi em{margin-left:auto;font:10px var(--mono);color:var(--muted);font-style:normal}
.fi .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:11px;background:var(--panel-2);border:1px solid var(--line)}
.mg{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}
.mn .im{margin:0;border-radius:12px}
.mn .lab{font-size:9.5px;padding-top:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.run{background:var(--ok);box-shadow:0 0 8px rgba(34,197,94,0.6)}
.dot.full{background:var(--orange);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.3}}
.lad{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.lad i{
  font:600 11px var(--mono);font-style:normal;padding:6px 10px;
  border-radius:var(--radius-pill);border:1px solid var(--line);color:var(--dim);background:var(--panel-2)
}
.lad i.past{border-color:rgba(255,77,18,0.22);color:var(--orange);background:rgba(255,77,18,0.08)}
.lad i.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.tl{border:1px solid var(--line);background:var(--panel);border-radius:16px;overflow:hidden}
.tl.ok{border-color:rgba(34,197,94,0.22)}
.tl.run{border-color:rgba(232,255,66,0.22)}
.tl.er{border-color:rgba(255,59,48,0.22)}
.th{position:relative;background:#0B0B0D;overflow:hidden}
.th img,.th video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tg{
  position:absolute;top:8px;left:8px;z-index:2;
  font:700 9px var(--mono);letter-spacing:0.08em;text-transform:uppercase;
  background:rgba(0,0,0,0.72);backdrop-filter:blur(8px);
  color:#fff;padding:4px 8px;border-radius:var(--radius-pill);border:1px solid rgba(255,255,255,0.12)
}
.nw{
  position:absolute;top:8px;right:8px;z-index:2;
  font:700 9px var(--mono);letter-spacing:0.06em;text-transform:uppercase;
  background:var(--accent);color:var(--accent-ink);padding:4px 8px;border-radius:var(--radius-pill)
}
.tx{font-size:13px;padding:10px 12px 6px;line-height:1.45;color:var(--ink-2)}
.mt{font:10px var(--mono);color:var(--muted);padding:0 12px 10px;letter-spacing:0.02em}
.kp{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0}
.kp > div{
  flex:1;min-width:110px;padding:14px 16px;border-radius:14px;
  background:var(--panel-2);border:1px solid var(--line);
}
.kp b{font:700 22px var(--display);display:block;color:var(--ink);letter-spacing:-0.02em}
.kp span.lab{display:block;margin-bottom:4px}
/* console */
#con{
  position:fixed;left:0;right:0;bottom:0;height:36vh;z-index:50;
  background:rgba(10,10,12,0.96);backdrop-filter:blur(16px);
  color:#D9E0EC;border-top:1px solid var(--line);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.16,1,.3,1);
  display:flex;flex-direction:column;
}
#con.on{transform:none}
#lb{flex:1;overflow:auto;padding:10px 14px;font:12px/1.6 var(--mono)}
.lg.er{color:#FF8A8A}.lg.wr{color:#FFC77A}.lg.ok{color:#7DFFB5}
#md{position:fixed;inset:0;background:rgba(0,0,0,0.64);backdrop-filter:blur(10px);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
#md.on{display:flex}
#md>div{
  background:var(--panel);max-width:680px;width:100%;max-height:86vh;overflow:auto;
  padding:24px;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.6)
}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{
  background:var(--ink);color:var(--bg);
  font:600 12px var(--mono);padding:10px 16px;border-radius:var(--radius-pill);
  box-shadow:0 10px 30px rgba(0,0,0,0.4)
}
#pl{position:fixed;inset:0;background:#000;z-index:100;display:none;align-items:center;justify-content:center}
#pl.on{display:flex}
#pv,#pi{max-width:100vw;max-height:100vh}
#sub{
  position:absolute;left:5%;right:5%;bottom:7%;text-align:center;
  color:#fff;font:600 20px/1.35 var(--display);text-shadow:0 2px 12px rgba(0,0,0,0.9)
}
#pl button{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.10);border-color:rgba(255,255,255,0.18);color:#fff;backdrop-filter:blur(8px)}
#pl button:hover{background:#fff;color:#000}

.export-dock{
  margin-top:18px;padding:16px 18px;border-radius:16px;
  background:linear-gradient(135deg, rgba(232,255,66,0.08), rgba(139,92,246,0.06));
  border:1px solid rgba(232,255,66,0.16);position:relative;overflow:hidden;
}
.export-dock::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, rgba(232,255,66,0.55), transparent);
}
.export-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* footer Higgsfield */
.site-foot{
  text-align:center;padding:28px 16px;margin-top:24px;
  border-top:1px solid var(--line);
  color:var(--muted);font:10px var(--mono);letter-spacing:0.08em;text-transform:uppercase;
}
.site-foot a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
.site-foot a:hover{color:var(--ink);border-color:var(--ink)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero,.cd,.ch{animation:fadeIn .4s cubic-bezier(.16,1,.3,1) both}
/* ── HIGGSFIELD MOBILE — iPhone first ── */

@media(max-width:980px){
  header{
    grid-template-columns:1fr;
    gap:10px;
    padding:12px 14px;
    position:sticky;
  }
  .logo{order:1}
  #steps{order:3;justify-content:flex-start;padding-bottom:2px;margin:0 -14px;padding-left:14px;padding-right:14px}
  .hb{order:2;justify-self:stretch;justify-content:space-between}
  .hb #qchip{margin-right:auto}
}
@media(max-width:700px){
  main{padding:18px 14px}
  h2{font-size:26px;letter-spacing:-0.02em}
  h3{font-size:12px}
  .hero{padding:18px;border-radius:16px}
  .hero h2{font-size:24px}
  .hero-kicker{font-size:9px}
  .st{padding:7px 11px;font-size:10px;min-height:34px}
  .grid{grid-template-columns:1fr;gap:12px}
  .choice{grid-template-columns:1fr;gap:12px}
  .gc{gap:7px}
  .gc button{padding:8px 12px;font-size:12px;min-height:38px}
  .mg{grid-template-columns:repeat(2,1fr);gap:10px}
  .kp{gap:10px}
  .kp > div{min-width:calc(50% - 5px);flex:none}
  .ft{flex-direction:column;align-items:stretch}

/* ═════════════════════════════════════════════════════════════════════
   PLANIFICATEUR MULTI-CLÉS
   ═════════════════════════════════════════════════════════════════════ */
async function slot(kind,opts){
  for(;;){
    if(TASK&&TASK.stop)throw new Error('stop');
    let live=KEYS.list.filter(o=>!o.off&&(kind!=='vid'||(VIDEO_DIRECT.has(o.provider)&&o.videoModel))&&(kind!=='txt'||o.textModel)&&(kind!=='img'||(o.imageModel&&IMAGE_API_COMPAT.has(o.provider))));
    if(kind==='img'&&opts&&opts.refs){
      // Les images de référence ne sont transmises qu'aux fournisseurs qui les acceptent.
      const withRef=live.filter(o=>IMAGE_REF_COMPAT.has(o.provider));
      if(withRef.length)live=withRef;
    }
    if(KEYS.mode==='manual'){
      const preferredLive=live.filter(o=>o.provider===KEYS.preferred);
      // Le fournisseur manuel est prioritaire s'il sait réaliser cette tâche; sinon on utilise un fournisseur compatible.
      if(preferredLive.length)live=preferredLive;
    }
    if(!live.length){
      const why=KEYS.mode==='manual'?'Le fournisseur choisi n’a pas de clé active ou ne prend pas en charge cette tâche.':'Aucune clé active compatible avec cette tâche.';
      throw Object.assign(new Error(why),{fatal:true});
    }
    const iv=60000/RPM[KEYS.plan][kind]*1.15*F,now=Date.now();
    let best=null,bt=1e18;
    for(const o of live){
      const t=Math.max(o[kind]||0,o.cool||0,now);
      // En automatique : privilégie la disponibilité, les fournisseurs ayant moins d'échecs,
      // puis alterne les fournisseurs en cas d'égalité. En manuel : respecte le fournisseur choisi.
      const score=(t-now)+Math.max(0,o['f'+kind]||0)*60000+(KEYS.mode==='auto'&&o.provider===KEYS.lastProvider?5000:0);
      if(score<bt){bt=score;best=o}
    }
    bt=Math.max(best[kind]||0,best.cool||0,now);
    if(bt>now){
      await sleep(Math.min(bt-now,400));
      continue;
    }
    if(best.cool>Date.now())continue;
    best[kind]=now+iv;
    KEYS.lastProvider=best.provider;
    return best;
  }
}
async function call(kind,url,body,tries,opts){

        const q=imgRequest(o,body);target=q.target;payload=q.payload;
      }else{

        if(kind==='txt')payload.model=o.textModel||payload.model;
        if(kind==='img')payload.model=o.imageModel||payload.model;
        if(o.provider!=='agnes')delete payload.chat_template_kwargs;
      }
      if(kind==='vid')payload.model=(KEYS.plan==='free'?'agnes-video-v2.0':'agnes-video-2.5-flash');
      const hh={'Content-Type':'application/json'};
      // Pollinations : le palier public n'a pas besoin de clé ; une clé courte (= placeholder de saisie) ne doit pas être envoyée.
      if(!(o.provider==='pollinations'&&String(o.k||'').length<20))hh.Authorization='Bearer '+o.k;
      const r=await fetch(target,{method:'POST',headers:hh,body:JSON.stringify(payload)});
      if(r.ok){

          }

      if(r.status==429){o.cool=Date.now()+(parseInt(r.headers.get('Retry-After'))||25)*1000;F=Math.min(4,F*1.5);err=new Error('429');continue}
      if(r.status==401||r.status==402||r.status==403){if(++o.bad>=2){o.off=true;log('wr','clé …'+o.k.slice(-4)+' désactivée')}err=new Error('HTTP '+r.status);continue}
      if(r.status>=500||r.status==408){if(kind==='img')o.fimg=(o.fimg||0)+1;err=new Error('HTTP '+r.status);await sleep(2000*Math.pow(2,a));continue}
      if(kind==='img'){o.fimg=(o.fimg||0)+1;err=new Error((PROVIDERS[o.provider]||PROVIDERS.custom).label+' HTTP '+r.status+' '+t);log('wr','image : échec chez '+(PROVIDERS[o.provider]||PROVIDERS.custom).label+'; essai d’un autre fournisseur compatible');continue}
      throw Object.assign(new Error('HTTP '+r.status+' '+t),{fatal:true});
    }catch(e){
      if(e.message=='stop')throw e;
      if(e.fatal&&kind!=='img')throw e;
      if(kind==='img'){o.fimg=(o.fimg||0)+1;log('wr','image : '+(PROVIDERS[o.provider]||PROVIDERS.custom).label+' indisponible, bascule automatique si possible');}
      err=e;
      await sleep(1500*(a+1));
    }
  }
  throw err||new Error('échec');
}

/* ═════════════════════════════════════════════════════════════════════
   JSON PARSER
   ═════════════════════════════════════════════════════════════════════ */
function J(t){
  if(!t)return null;
  let c=String(t).replace(/```json|```/g,'');
  const a=c.indexOf('{'),b=c.lastIndexOf('}');
  if(a<0||b<0)return null;
  c=c.slice(a,b+1);
  try{return JSON.parse(c)}catch(e){}
  let o='',s=false,x=false;
  for(let i=0;i<c.length;i++){
    const ch=c[i];
    if(x){o+=ch;x=false;continue}
    if(ch=='\\'){o+=ch;x=true;continue}
    if(ch=='"'){s=!s;o+=ch;continue}
    if(s&&ch=='\n'){o+='\\n';continue}
    if(s&&ch=='\r'){continue}
    if(s&&ch.charCodeAt(0)<32){o+=' ';continue}
    o+=ch;
  }
  try{return JSON.parse(o.replace(/,\s*([}\]])/g,'$1'))}catch(e){return null}
}

/* ═════════════════════════════════════════════════════════════════════
   IMAGES — CONVERSION ASYNCHRONE NON BLOQUANTE
   ═════════════════════════════════════════════════════════════════════ */
/* Convertit une URL en data URI. Ne bloque PAS le pipeline : utilisé
   uniquement en arrière-plan ou quand une référence est nécessaire. */
function toData(u){
  return new Promise(resolve=>{
    if(!u)return resolve(null);
    if(u.indexOf('data:')===0)return resolve(u);
    fetch(u).then(r=>r.blob()).then(b=>{
      const o=URL.createObjectURL(b),im=new Image();
      im.onload=()=>{
        try{
          const s=Math.min(1,1024/Math.max(im.width,im.height));
          const c=document.createElement('canvas');
          c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          URL.revokeObjectURL(o);
          resolve(c.toDataURL('image/jpeg',0.86));
        }catch(e){URL.revokeObjectURL(o);resolve(null)}
      };
      im.onerror=()=>{URL.revokeObjectURL(o);resolve(null)};
      im.src=o;
    }).catch(()=>resolve(null));
  });
}
/* Lance la génération d'image et retourne immédiatement l'URL.
   La conversion en data URI se fait en arrière-plan (utilisée plus tard
   seulement si l'image sert de référence à une autre génération). */
function mkImg(prompt,refUris,ratio){
  const body={model:IMG,prompt:san(prompt),n:1,size:'1K',ratio:ratio||P.ratio,extra_body:{response_format:'url'}};
  if(refUris&&refUris.length)body.extra_body.image=refUris.filter(Boolean).slice(0,4);
  return call('img',API+'/images/generations',body,3,{refs:!!(refUris&&refUris.filter(Boolean).length)}).then(r=>r.json()).then(d=>{
    const u=imgFrom(d);
    if(!u)throw new Error('pas d\'image reçue');
    const img={u:u,d:u.indexOf('data:')===0?u:null};
    if(!img.d){
      // Conversion en arrière-plan : ne bloque pas le pipeline
      img._conv=toData(u).then(dd=>{img.d=dd||u;return img.d}).catch(()=>{img.d=u;return img.d});
    }
    return img;
  });
}
/* Retourne une promesse vers le data URI de l'image (conversion à la demande) */
function ensureRef(img){
  if(!img)return Promise.resolve(null);
  if(img.d)return Promise.resolve(img.d);
  if(img._conv)return img._conv;
  img._conv=toData(img.u).then(dd=>{img.d=dd||img.u;return img.d}).catch(()=>{img.d=img.u;return img.d});
  return img._conv;
}
function readFile(f,maxSide){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const s=Math.min(1,maxSide/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        const d=c.toDataURL('image/jpeg',0.88);
        res({u:d,d:d});
      };
      im.onerror=()=>res(null);
      im.src=fr.result;
    };
    fr.readAsDataURL(f);
  });
}

const newP=()=>({
  id:uid()+uid(),
  created:Date.now(),
  upd:Date.now(),
  page:0,last:1,max:0,
  genre:null,ratio:'16:9',
  synRaw:'',syn:null,final:'',title:'',
  nsc:5,
  chars:[],scenes:[],
  notes:'',
  sub:{},
  q:{step:0,next:0,st:'idle',on:false}
});
function setP(p){
  P=p;
  P.sub=P.sub||{};
  Q=P.q=P.q||{step:0,next:0,st:'idle',on:false};
  P.chars=P.chars||[];
  P.scenes=P.scenes||[];
  P.chars.forEach(c=>c.busy=false);
  P.scenes.forEach(s=>{
    s.busy=false;
    (s.shots||[]).forEach(h=>{
      h.busy=false;
      if(h.vst=='run'&&!h.task)h.vst='wait';
    });
  });
  dbPut('config',{key:'last',v:P.id});
}
const shots=()=>{
  const out=[];
  P.scenes.forEach(s=>{(s.shots||[]).forEach(h=>out.push({h:h,s:s}))});
  return out;
};
const allObjs=()=>{
  const arr=[].concat(P.chars,P.scenes);
  P.scenes.forEach(s=>(s.shots||[]).forEach(h=>arr.push(h)));
  return arr;
};
const anyBusy=()=>allObjs().some(o=>o.busy);
function find(id){
  if(id=='P')return{t:'p',o:P};
  for(let i=0;i<P.chars.length;i++)if(P.chars[i].id==id)return{t:'c',o:P.chars[i]};
  for(let i=0;i<P.scenes.length;i++){
    const s=P.scenes[i];
    if(s.id==id)return{t:'s',o:s};
    const sh=s.shots||[];
    for(let j=0;j<sh.length;j++)if(sh[j].id==id)return{t:'h',o:sh[j],s:s};
  }
  return null;
}

const sheet=n=>P.chars.filter(c=>n&&n.indexOf(c.name)>=0).map(c=>c.name+': '+c.desc+(c.outfit?', wearing '+c.outfit:'')).join('; ');
/* Retourne les OBJETS image des personnages présents (pour ensureRef) */
const cImgs=n=>P.chars.filter(c=>n&&n.indexOf(c.name)>=0&&c.img).map(c=>c.img).slice(0,3);
const st=()=>P.genre?P.genre.style:'cinematic';

function promptFor(f){
  const o=f.o;
  if(f.t=='c'){
    return {
      p:'Full-body character reference, plain neutral background, '+st()+'. '+o.name+': '+o.desc+'. '+(o.outfit?'Wearing: '+o.outfit+'.':'')+' No text, no watermark.',
      refs:[],
      ratio:'9:16'
    };
  }
  if(f.t=='s'){
    const sh=sheet(o.chars);
    return {
      p:'Cinematic establishing frame. '+st()+'. Setting: '+o.decor+'. Mood: '+o.mood+'. '+(sh?'Characters present (identical to references): '+sh+'.':'')+' No text, no watermark.',
      refs:cImgs(o.chars)
    };
  }
  // shot
  const sh=sheet(o.chars);
  return {
    p:'Cinematic film still, '+(o.size||'medium')+' shot. '+st()+'. Setting: '+f.s.decor+'. Action: '+o.action+'. Camera: '+o.camera+'. Characters (identical face, hair and outfit as the reference images): '+(sh||'none')+'. No text, no watermark.',
    refs:cImgs(o.chars).concat(f.s.img?[f.s.img]:[])
  };
}

/* ═════════════════════════════════════════════════════════════════════
   GÉNÉRATION D'IMAGE
   ═════════════════════════════════════════════════════════════════════ */
async function gen(id,opt){
  opt=opt||{};
  const f=find(id);
  if(!f||f.o.busy)return;
  const o=f.o;
  o.busy=true;o.err='';refresh(id);
  try{
    const q=promptFor(f);
    let p=q.p;
    let refObjs=q.refs.filter(Boolean);
    if(opt.edit&&o.img){
      refObjs=[o.img].concat(refObjs);
      p+=' Edit the first reference image: '+opt.extra+'. Keep everything else identical.';
    }else if(opt.extra){
      p+=' '+opt.extra+'.';
    }
    // Convertit les références en data URI (déjà en cache si déjà générées)
    const refUris=[];
    for(let i=0;i<refObjs.length;i++){
      const uri=await ensureRef(refObjs[i]);
      if(uri)refUris.push(uri);
    }
    o.img=await mkImg(p,refUris,q.ratio);
  }catch(e){
    if(e.message!='stop'){
      o.err='Échec : '+String(e.message).slice(0,80);
      log('er','image : '+e.message);
    }
  }
  o.busy=false;refresh(id);save();
}
async function imgPass(list,label){
  const todo=list.filter(o=>!o.img);
  if(!todo.length)return;
  setTiles(list);
  const it=fd('Création des '+label+' (0/'+todo.length+')');
  setPg(0,todo.length);
  let n=0;
  await Promise.all(todo.map(async o=>{
    await gen(o.id);
    n++;
    setPg(n,todo.length);
    it.t='Création des '+label+' ('+n+'/'+todo.length+')';
    paintFeed();
  }));
  chk();
  const miss=list.filter(o=>!o.img);
  if(miss.length){
    it.t='Nouvel essai pour '+miss.length+' image(s)…';
    paintFeed();
    await Promise.all(miss.map(o=>gen(o.id)));
    chk();
  }
  fdDone(it,list.filter(o=>o.img).length+'/'+list.length+' '+label+' prêt(e)s');
}

function setTiles(l){TASK.tiles=l;const e=$('#tiles');if(e)e.innerHTML=l.map(mini).join('')}

async function task(step,title,fn,after){
  if(TASK)return;
  TASK={step:step,title:title,fn:fn,after:after,items:[],start:Date.now(),stop:false,err:null,pg:null,tiles:null};
  page=step;
  render();
  try{
    await fn();
    chk();
  }catch(e){
    const T=TASK;
    if(e.message=='stop'){
      TASK=null;
      toast('Arrêté');
      render();
      return;
    }
    T.items.forEach(i=>{if(i.s=='run')i.s='er'});
    T.err=e.message;
    log('er',title+' : '+e.message);
    render();
    paintFeed();
    return;
  }
  TASK=null;
  after();
}
function retryTask(){const T=TASK;if(!T||!T.err)return;TASK=null;task(T.step,T.title,T.fn,T.after)}
setInterval(()=>{if(!TASK||TASK.err)return;const e=$('#el');if(e)e.textContent=Math.round((Date.now()-TASK.start)/1000)+' s';paintFeed()},1000);

/* Pas d'auto-advancement : l'utilisateur valide chaque étape avec le bouton */
function done(step,sub){P.sub[step]=sub;save();render()}
function onEnter(){
  if(TASK||!P)return;
  const s=P.sub[page]||(page==2?'in':'cfg');
  if(s!='cfg')return;
  if(page==3)runChars(P.chars.length?'own':'ai');
  else if(page==4)runScenes(P.nsc||5);
  else if(page==5)runShots();
  // Page 6 : l'utilisateur clique explicitement sur "Lancer les vidéos"
}

    4500,0.8);
  if(!j.base||!Array.isArray(j.suggestions))throw new Error('format inattendu');
  P.title=P.title||String(j.title||'');
  P.syn={base:String(j.base),sugg:j.suggestions.map(String).slice(0,10),sel:[]};
}
async function aiMerge(){
  const s=P.syn.sel.map(i=>P.syn.sugg[i]);
  const j=await llmJSON('Scénariste. Tu fusionnes sans perdre la cohérence.',
    'Version de base :\n'+P.syn.base+'\n\nIdées à intégrer :\n'+s.map((x,i)=>(i+1)+'. '+x).join('\n')+'\n\nÉcris UN synopsis final cohérent en français (8 à 12 phrases). {"final":"..."}',
    3000,0.6);
  P.final=String(j.final||P.syn.base);
}
async function aiChars(){
  const j=await llmJSON('Directeur de casting et chef costumier.',
    CTX()+'\nSynopsis :\n'+P.final+'\nPropose 3 à 6 personnages principaux. {"characters":[{"name":"","role":"rôle en français","desc":"precise English physical description: age, face, hair, skin, build, distinctive details","outfit":"precise English costume with colors"}]}',
    3500,0.7);
  const cs=j.characters||[];
  if(!cs.length)throw new Error('aucun personnage reçu');
  cs.forEach(c=>P.chars.push({id:uid(),name:String(c.name||'?'),role:String(c.role||''),desc:String(c.desc||''),outfit:String(c.outfit||''),img:null,busy:false}));
}
async function aiScenes(n){
  const j=await llmJSON('Scénariste de cinéma d\'auteur. Dialogues naturels en français, jamais de musique.',
    CTX()+'\nTitre : '+P.title+'\nSynopsis :\n'+P.final+'\nPersonnages :\n'+P.chars.map(c=>c.name+' : '+c.role+'. '+c.desc).join('\n')+'\nÉcris exactement '+n+' scènes qui racontent tout le film. {"scenes":[{"title":"","summary":"2-3 phrases en français","decor":"precise English place description","mood":"English mood and lighting","chars":["noms exacts"],"dialogue":[{"who":"","line":"réplique courte en français"}]}]}',
    7000,0.75);
  const sc=j.scenes||[];
  if(!sc.length)throw new Error('aucune scène reçue');
  P.scenes=sc.map(s=>({id:uid(),title:String(s.title||''),summary:String(s.summary||''),decor:String(s.decor||''),mood:String(s.mood||''),chars:Array.isArray(s.chars)?s.chars.map(String):[],dialogue:(s.dialogue||[]).map(d=>(d.who||'')+': '+(d.line||'')).join('\n'),img:null,busy:false,shots:[]}));
}
async function aiShots(s){
  const j=await llmJSON('Réalisateur et chef opérateur.',
    CTX()+'\nScène : '+s.title+'. '+s.summary+'\nDécor : '+s.decor+'. Ambiance : '+s.mood+'.\nPersonnages : '+(s.chars||[]).join(', ')+'\nDialogues :\n'+s.dialogue+'\nDécoupe en 3 à 5 plans de 8 à 10 secondes. Répartis les répliques dans les plans. {"shots":[{"size":"wide|medium|close-up|over-the-shoulder","camera":"English camera movement","action":"English visual description, 1-2 sentences","chars":["noms"],"who":"","line":"réplique en français ou vide"}]}',
    3500,0.7);
  const a=j.shots||[];
  if(!a.length)throw new Error('aucun plan reçu');
  s.shots=a.map(h=>({id:uid(),size:String(h.size||'medium'),camera:String(h.camera||'static'),action:String(h.action||''),chars:Array.isArray(h.chars)?h.chars.map(String):[],who:String(h.who||''),line:String(h.line||''),img:null,busy:false,vst:'wait'}));
}
async function aiDescribe(c){
  const j=await llmJSON('Directeur de casting.','Décris cette personne. {"desc":"precise English physical description: age, face, hair, skin, build","outfit":"precise English clothing with colors"}',500,0.2,[ref(c.img)]);
  c.desc=String(j.desc||c.desc);
  c.outfit=String(j.outfit||c.outfit);
}

   PIPELINES (avec vues d'attente)
   ═════════════════════════════════════════════════════════════════════ */
function runSyn(){
  task(2,'Analyse de votre synopsis',async()=>{
    const a=fd('Lecture de votre idée et du genre choisi');fdDone(a);
    const b=fd('L\'IA réécrit votre synopsis et imagine 10 propositions plus puissantes…');
    await aiSyn();
    chk();
    fdDone(b,'Synopsis réécrit + 10 propositions prêtes');
  },()=>done(2,'pick'));
}
function runMerge(){
  task(2,'Fusion de vos choix',async()=>{
    const a=fd('L\'IA fusionne '+P.syn.sel.length+' suggestion(s) avec votre synopsis…');
    await aiMerge();
    chk();
    fdDone(a,'Synopsis final écrit');
  },()=>done(2,'fin'));
}
function runChars(m){
  let ai=(m=='ai');
  task(3,'Création des personnages',async()=>{
    if(ai){
      const a=fd('L\'IA lit votre synopsis et imagine les personnages…');
      await aiChars();
      ai=false;chk();
      fdDone(a,P.chars.length+' personnages imaginés : '+P.chars.map(c=>c.name).join(', '));
    }
    for(const c of P.chars.filter(c=>c.img&&!c.desc)){
      const d=fd('Analyse de la photo de '+c.name+'…');
      try{await aiDescribe(c)}catch(e){if(e.message=='stop')throw e}
      fdDone(d,'Photo de '+c.name+' analysée');
    }
    await imgPass(P.chars,'portraits');
  },()=>done(3,'rev'));
}
function runScenes(n){
  let w=true;
  task(4,'Écriture du scénario',async()=>{
    if(w){
      const a=fd('L\'IA écrit le scénario : '+n+' scènes, avec décors, ambiances et dialogues…');
      await aiScenes(n);
      w=false;chk();
      fdDone(a,P.scenes.length+' scènes écrites');
    }
    await imgPass(P.scenes,'images de scènes');
  },()=>done(4,'rev'));
}
function runShots(){
  task(5,'Découpage en plans et images',async()=>{
    const todo=P.scenes.filter(s=>!(s.shots||[]).length);
    if(todo.length){
      const a=fd('Découpage de '+todo.length+' scène(s) en plans…');
      let k=0;
      const cut=async s=>{
        try{await aiShots(s)}catch(e){if(e.message=='stop')throw e;log('wr',s.title+' : '+e.message)}
        k++;
        a.t='Découpage des scènes ('+k+'/'+todo.length+')…';
        paintFeed();
      };
      await Promise.all(todo.map(cut));
      chk();
      for(const s of P.scenes.filter(s=>!(s.shots||[]).length))await cut(s);
      fdDone(a,'Scènes découpées en '+shots().length+' plans');
    }
    if(!shots().length)throw new Error('Aucun plan créé');
    await imgPass(shots().map(x=>x.h),'images de plans');
  },()=>done(5,'rev'));
}

async function launchExternalVideo(h,s,o,fr,D){
  const provider=o.provider,model=o.videoModel||PROVIDERS[provider].video;
  const prompt=vp(h,s);
  const headers={'Content-Type':'application/json','Authorization':'Bearer '+o.k};
  const checked=async(r)=>{if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text().catch(()=>'' )).slice(0,160));return r.json()};
  if(provider==='pollinations'){
    // Pollinations returns the MP4 directly; this is synchronous and browser CORS may depend on service policy.
    const url=(o.base||'https://gen.pollinations.ai').replace(/\/+$/,'')+'/video/'+encodeURIComponent(prompt)+'?model='+encodeURIComponent(model)+'&duration=5&key='+encodeURIComponent(o.k);
    const r=await fetch(url,{method:'GET'});
    if(!r.ok)throw new Error('Pollinations HTTP '+r.status+' '+(await r.text().catch(()=>'' )).slice(0,120));
    const blob=await r.blob();
    if(!blob.type.includes('video')&&!blob.size)throw new Error('Pollinations n’a pas retourné de vidéo');
    h.video=URL.createObjectURL(blob);h.vst='ok';h.seen=false;h.msg='vidéo prête (session navigateur)';
    log('ok','vidéo Pollinations prête');toast('🎬 Vidéo prête');save();refresh(h.id);return;
  }
  if(provider==='runware'){
    const body=[{taskType:'videoInference',taskUUID:uid()+'-'+Date.now(),model,positivePrompt:prompt,duration:5,width:D[0],height:D[1],deliveryMethod:'async'}];
    if(fr&&/^https?:/i.test(fr))body[0].frameImages=[{inputImage:fr}];
    const r=await fetch((o.base||'https://api.runware.ai/v1').replace(/\/+$/,''),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+o.k},body:JSON.stringify(body)});
    const d=await checked(r);const taskUUID=(Array.isArray(d)?d[0]&&d[0].taskUUID:null)||d.taskUUID||d.data?.taskUUID;
    if(!taskUUID)throw new Error('Runware : taskUUID absent de la réponse');
    h.task={provider,k:o.k,id:taskUUID,base:o.base,model};save();
    await pollExternalVideo(h);return;
  }
  if(provider==='kieai'){
    const base=(o.base||'https://api.kie.ai').replace(/\/+$/,'');
    const body={model,input:{prompt,aspect_ratio:P.ratio,duration:5,quality:'720p'}};
    if(fr&&/^https?:/i.test(fr))body.input.image_url=fr;
    const d=await checked(await fetch(base+'/api/v1/jobs/createTask',{method:'POST',headers,body:JSON.stringify(body)}));
    const id=d.data?.taskId||d.taskId;if(!id)throw new Error('KIE AI : taskId absent ('+(d.msg||'réponse invalide')+')');
    h.task={provider,k:o.k,id,base,model};save();await pollExternalVideo(h);return;
  }
  if(provider==='wavespeed'){
    const base=(o.base||'https://api.wavespeed.ai/api/v3').replace(/\/+$/,'');
    const endpoint=model.startsWith('http')?model:(base+'/'+model.replace(/^\/+/,''));
    const body={prompt,aspect_ratio:P.ratio,duration:5};if(fr&&/^https?:/i.test(fr))body.image=fr;
    const d=await checked(await fetch(endpoint,{method:'POST',headers,body:JSON.stringify(body)}));
    const id=d.data?.id||d.id||d.data?.prediction_id||d.prediction_id;
    const direct=extractVideoUrl(d);
    if(direct){h.video=direct;h.vst='ok';h.seen=false;save();refresh(h.id);return;}
    if(!id)throw new Error('WaveSpeed : identifiant de tâche absent; vérifiez le modèle/endpoint');
    h.task={provider,k:o.k,id,base,model};save();await pollExternalVideo(h);return;
  }
  if(provider==='magichour'){
    const base=(o.base||'https://api.magichour.ai').replace(/\/+$/,'');
    const m=model||'default';
    const body={name:'HIGGSFREE '+new Date().toISOString().slice(0,19),end_seconds:/^veo/.test(m)?6:5,aspect_ratio:P.ratio,style:{prompt}};
    if(m!=='default')body.model=m;
    if(!/^(gemini|kling-2|wan-2)/.test(m))body.audio=true;
    const d=await checked(await fetch(base+'/v1/text-to-video',{method:'POST',headers,body:JSON.stringify(body)}));
    const id=d.id||d.data?.id;if(!id)throw new Error('Magic Hour : identifiant de projet absent');
    h.task={provider,k:o.k,id,base,model:m};save();await pollExternalVideo(h);return;
  }
  if(provider==='higgsfield'){
    // Authentification Higgsfield : « Key ID:SECRET » ; le champ modèle contient le chemin du modèle (ex. kling-video/v2.6/pro/text-to-video).
    const base=(o.base||'https://api.higgsfield.ai').replace(/\/+$/,'');
    if(!model)throw new Error('Higgsfield : indiquez le chemin du modèle (ex. kling-video/v2.6/pro/text-to-video)');

  }

  }
  if(provider==='rewind'){
    // Rewind.ai : POST /v1/videos/generate-async (renvoie un job id) + GET /v1/jobs/:id. Clé liée à un compte connecté requise.

    if(provider==='arkroute'){

async function poll(h){
  const t=h.task,model=VID[KEYS.plan],end=Date.now()+30*60000;
  let n=0,miss=0;const key=t.k;
  try{
    await sleep(KEYS.plan=='free'?30000:8000);
    while(Date.now()<end&&P){
      const ids=[t.id];
      if(t.inner&&t.inner!=t.id)ids.push(t.inner);
      const iv=Math.min(20000,6000+n*1500);n++;
      let d=null;
      for(let i=0;i<ids.length;i++){
        try{
          const r=await fetch(POLL+'?video_id='+encodeURIComponent(ids[i])+'&model_name='+encodeURIComponent(model),{headers:{Authorization:'Bearer '+key}});
          if(r.status==429){await sleep(8000);continue}
          if(!r.ok){miss++;continue}
          d=await r.json();
          break;
        }catch(e){miss++}
      }
      if(d){
        const s=String(d.status||d.state||'').toLowerCase();
        h.msg=d.progress?d.progress+'%':s;
        refresh(h.id);
        if(['completed','succeeded','done','success','finished','ready'].indexOf(s)>=0){
          const u=(d.metadata&&(d.metadata.url||d.metadata.video_url))||(d.output&&(d.output.url||d.output.video_url))||(d.data&&(d.data.url||d.data.video_url))||d.url||d.video_url;
          if(!u)throw new Error('terminé sans URL');
          h.video=u;h.vst='ok';h.seen=false;h.err='';
          log('ok','vidéo prête');toast('🎬 Nouvelle vidéo prête');
          save();refresh(h.id);
          return;
        }
        if(['failed','error','cancelled','canceled','rejected'].indexOf(s)>=0){
          throw new Error(String((d.error&&d.error.message)||d.error||'échec génération').slice(0,100));
        }
      }else if(miss>20)throw new Error('suivi impossible');
      await sleep(iv);
    }
    throw new Error('délai dépassé');
  }catch(e){
    h.vst='er';h.err=e.message;
    log('er','vidéo : '+e.message);
    save();refresh(h.id);
  }
}

async function play(loop){
  loop=!!loop;
  const a=shots().filter(x=>x.h.video||x.h.img);
  if(!a.length)return toast('Rien à lire pour l\'instant');
  playing=true;
  $('#pl').classList.add('on');
  const v=$('#pv'),im=$('#pi');
  let i=0;
  while(i<a.length){
    if(!playing)break;
    const h=a[i].h;
    $('#sub').textContent=h.line?(h.who?h.who+' : ':'')+h.line:'';
    if(h.video){
      im.style.display='none';v.style.display='block';
      v.src=h.video;
      await new Promise(r=>{v.onended=r;v.onerror=r;v.play().catch(r)});
      h.seen=true;
    }else{
      v.style.display='none';im.style.display='block';
      im.src=ref(h.img);
      speak(h.line);
      await sleep(Math.max(3500,(h.line||'').length*75));
    }
    i++;
    if(loop&&i>=a.length)i=0;
  }
  stopPlay();save();

  else if(a=='scgo'){if(P.scenes.length&&!confirm('Remplacer les scènes existantes ?'))return;runScenes(P.nsc||5)}
  else if(a=='plgo')runShots();
  else if(a=='copydlg'){
    const t=P.scenes.map((sc,i)=>'Scène '+(i+1)+' — '+sc.title+'\n'+(sc.dialogue||'')).join('\n\n');
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Dialogues copiés')).catch(()=>toast('Copie impossible'));else toast('Presse-papiers non disponible');
  }
  else if(a=='dupscene'){
    if(!P.scenes.length)return toast('Aucune scène à dupliquer');
    const s=JSON.parse(JSON.stringify(P.scenes[P.scenes.length-1]));
    s.id=uid();s.title=s.title+' (copie)';s.img=null;s.busy=false;s.shots=[];
    P.scenes.push(s);render(true);toast('Scène dupliquée');
  }
  else if(a=='addscene'){P.scenes.push({id:uid(),title:'Nouvelle scène',summary:'',decor:'',mood:'',chars:[],dialogue:'',img:null,busy:false,shots:[]});render(true)}
  else if(a=='dupshot'){
    const f=find(id);if(!f||f.t!='h')return;
    const h=JSON.parse(JSON.stringify(f.o));h.id=uid();h.img=null;h.video=null;h.vst='wait';h.busy=false;h.task=null;h.seen=false;
    (f.s.shots=f.s.shots||[]).push(h);render(true);toast('Plan dupliqué');
  }
  else if(a=='addshot'){const f=find(id);if(f){const s=f.o;(s.shots=s.shots||[]).push({id:uid(),size:'medium',camera:'static',action:'',chars:[],who:'',line:'',img:null,busy:false,vst:'wait'});render(true)}}
  else if(a=='copyprompts'){
    const t=shots().map((x,i)=>'Plan '+(i+1)+': '+x.h.action).join('\n');
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Prompts copiés')).catch(()=>toast('Copie impossible'));else toast('Presse-papiers non disponible');
  }
  else if(a=='dlimg'){
    const f=find(id),o=f&&f.o,u=o&&ref(o.img);
    if(!u)return toast('Aucune image à télécharger');
    const kind=b.dataset.k||'img';
    const slug=((P.title||'film').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'film');
    const save=(href,ext)=>{const l=document.createElement('a');l.href=href;l.download=slug+'-'+kind+'-'+String(id).slice(-4)+'.'+(ext||'png');document.body.appendChild(l);l.click();l.remove();};
    (async()=>{try{const r=await fetch(u);if(!r.ok)throw 0;const bl=await r.blob();const ou=URL.createObjectURL(bl);const ext=(bl.type||'').includes('jpeg')||(bl.type||'').includes('jpg')?'jpg':(bl.type||'').includes('webp')?'webp':'png';save(ou,ext);setTimeout(()=>URL.revokeObjectURL(ou),8000);toast('⬇ Image téléchargée')}catch(e){save(u);toast('⬇ Image téléchargée')}})();
  }
  else if(a=='redo')redo(+b.dataset.n);
  else if(a=='gen'){const i=document.querySelector('[data-mod="'+id+'"]');gen(id,{extra:i&&i.value.trim()})}
  else if(a=='mod'){
    const i=document.querySelector('[data-mod="'+id+'"]');
    if(i&&i.value.trim())gen(id,{edit:true,extra:i.value.trim()});
    else{toast('Écrivez d\'abord ce que vous voulez changer');if(i)i.focus()}
  }
  else if(a=='dupchar'){
    const f=find(id);if(!f||f.t!='c')return;
    const c=JSON.parse(JSON.stringify(f.o));c.id=uid();c.name=c.name+' (copie)';c.img=null;c.busy=false;
    P.chars.push(c);render(true);toast('Personnage dupliqué');
  }
  else if(a=='del'){
    if(!confirm('Supprimer ?'))return;
    const f=find(id);
    if(!f)return;
    if(f.t=='c')P.chars=P.chars.filter(c=>c.id!=id);
    else if(f.t=='s')P.scenes=P.scenes.filter(s=>s.id!=id);
    else f.s.shots=f.s.shots.filter(h=>h.id!=id);
    render(true);
  }
  else if(a=='stoptask'){TASK.stop=true;toast('Arrêt en cours…')}
  else if(a=='retrytask')retryTask();
  else if(a=='canceltask'){TASK=null;render()}
  else if(a=='qstart')qstart();
  else if(a=='qpause'){Q.on=false;Q.st='paused';save();qui()}
  else if(a=='qnow'){Q.on=true;Q.next=0;log('in','test manuel de la file vidéo');save()}
  else if(a=='retry'){const f=find(id);f.o.vst='wait';f.o.err='';Q.on=true;if(Q.st=='paused'||Q.st=='idle')Q.st='run';refresh(id);qui()}
  else if(a=='play')play();
  else if(a=='playloop')play(true);
  else if(a=='searchproj'){
    const q=(prompt('Rechercher dans le projet :')||'').toLowerCase().trim();
    if(!q)return;
    const hits=[];
    P.scenes.forEach((sc,i)=>{if((sc.title+' '+sc.summary+' '+sc.dialogue).toLowerCase().includes(q))hits.push('Scène '+(i+1)+' — '+sc.title)});
    P.chars.forEach(c=>{if((c.name+' '+c.role+' '+c.desc).toLowerCase().includes(q))hits.push('Personnage — '+c.name)});
    alert(hits.length?hits.join('\n'):'Aucun résultat');
  }
  else if(a=='stopplay')stopPlay();
  else if(a=='export'){
    const u=URL.createObjectURL(new Blob([JSON.stringify(P)],{type:'application/json'}));
    const l=document.createElement('a');
    l.href=u;l.download=(P.title||'film')+'.json';l.click();
  }
  else if(a=='copysyn'){
    const t=P.final||'';
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Synopsis copié dans le presse-papiers')).catch(()=>toast('Copie impossible'));
    else toast('Presse-papiers non disponible');
  }
  else if(a=='exportsrt'){
    let srt='',idx=1,t=0;
    shots().forEach(x=>{
      const dur=9;
      const start=t,end=t+dur;
      const fmt=n=>{const h=Math.floor(n/3600),m=Math.floor((n%3600)/60),sec=Math.floor(n%60),ms=Math.round((n-sec)*1000);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')+',000'};
      if(x.h.line){srt+=idx+'\n'+fmt(start)+' --> '+fmt(end)+'\n'+(x.h.who?x.h.who+': ':'')+x.h.line+'\n\n';idx++}
      t=end;
    });
    const u=URL.createObjectURL(new Blob([srt],{type:'text/plain'}));
    const l=document.createElement('a');l.href=u;l.download=(P.title||'film')+'.srt';l.click();
  }
  else if(a=='exportmd'){
    let md='# '+(P.title||'Film')+'\n\n';
    md+='Genre : '+(P.genre?P.genre.name:'')+'\n\n';
    md+='## Synopsis\n\n'+(P.final||'')+'\n\n';
    md+='## Personnages\n\n';
    P.chars.forEach(c=>{md+='### '+c.name+' — '+c.role+'\n'+c.desc+'\n\n';});
    if(P.notes)md+='## Notes\n\n'+P.notes+'\n\n';
    md+='## Scènes\n\n';
    P.scenes.forEach((sc,i)=>{md+='### Scène '+(i+1)+' — '+sc.title+'\n'+sc.summary+'\n\nDécor : '+sc.decor+'\n\nAmbiance : '+sc.mood+'\n\n';
      if(sc.dialogue)md+='Dialogues :\n'+sc.dialogue+'\n\n';
      (sc.shots||[]).forEach((h,j)=>{md+='- Plan '+(j+1)+' ('+h.size+') : '+h.action+'\n  '+(h.line?(h.who?h.who+' : ':'')+h.line:'')+'\n';});
      md+='\n';
    });
    const u=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));
    const l=document.createElement('a');
    l.href=u;l.download=(P.title||'film')+'.md';l.click();
  }
  else if(a=='sess')sessions();
  else if(a=='new'){setP(newP());$('#md').classList.remove('on');page=KEYS.list.length?1:0;render()}
  else if(a=='open'){
    const p=await dbGet('sessions',id);
    if(p){setP(p);page=KEYS.list.length?Math.max(1,Math.min(p.page||1,6)):0;$('#md').classList.remove('on');render();resume()}
  }
  else if(a=='renamesess'){
    const p=await dbGet('sessions',id);
    if(p){const t=prompt('Nouveau titre :',p.title||(p.genre&&p.genre.name)||'');if(t!=null){p.title=t;p.upd=Date.now();await dbPut('sessions',p);if(P.id==id)P.title=t;toast('Renommé');sessions()}}
  }
  else if(a=='dup'){
    const p=await dbGet('sessions',id);
    if(p){const c=JSON.parse(JSON.stringify(p));c.id=uid()+uid();c.title=(c.title||'')+' (copie)';c.created=Date.now();c.upd=Date.now();await dbPut('sessions',c);toast('Session dupliquée');sessions()}
  }
  else if(a=='clearallsess'){
    if(!confirm('Supprimer toutes les sessions ?'))return;
    const l=await dbAll('sessions');
    for(const p of l)await dbDel('sessions',p.id);
    setP(newP());page=KEYS.list.length?1:0;render();sessions();toast('Sessions effacées');
  }
  else if(a=='delsess'){
    if(!confirm('Supprimer cette session ?'))return;
    await dbDel('sessions',id);
    if(P.id==id){setP(newP());page=KEYS.list.length?1:0;render()}
    sessions();
  }
}

 if(e.target&&(e.target.id==='mode'||e.target.id==='preferred')){

function resume(){
  shots().forEach(x=>{
    if(x.h.vst=='run'&&x.h.task){
      if(KEYS.list.some(k=>k.k==x.h.task.k)){
        if(x.h.task.provider)pollExternalVideo(x.h).catch(e=>{x.h.vst='er';x.h.err=String(e.message||e).slice(0,180);log('er','reprise vidéo : '+x.h.err);refresh(x.h.id);save();});
        else poll(x.h);
      }
      else x.h.vst='wait';
    }
  });
  qui();
}

(function(){
  var b=document.getElementById("boot");
  function hideBoot(){if(b&&!b.classList.contains("done")){b.classList.add("done");setTimeout(function(){if(b&&b.parentNode)b.parentNode.removeChild(b)},650)}}
  window.addEventListener("load",function(){setTimeout(hideBoot,900)});
  setTimeout(hideBoot,2600);
  var c=document.getElementById("cur"),r=document.getElementById("curR");
  var mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  if(window.matchMedia&&matchMedia("(hover:hover) and (pointer:fine)").matches&&c&&r){
    document.addEventListener("mousemove",function(e){mx=e.clientX;my=e.clientY;c.style.transform="translate("+mx+"px,"+my+"px) translate(-50%,-50%)"},{passive:true});
    (function loop(){rx+=(mx-rx)*.16;ry+=(my-ry)*.16;r.style.transform="translate("+rx+"px,"+ry+"px) translate(-50%,-50%)";requestAnimationFrame(loop)})();
  }
  document.addEventListener("mousemove",function(e){
    var t=(e.target&&e.target.closest)?e.target.closest(".cd,.hero,.export-dock"):null;
    if(t){var o=t.getBoundingClientRect();t.style.setProperty("--mx",(e.clientX-o.left)+"px");t.style.setProperty("--my",(e.clientY-o.top)+"px")}
  },{passive:true});
  var pal=document.getElementById("pal"),inp=document.getElementById("palIn"),lst=document.getElementById("palList"),sel=0;
  function items(){return STEPS.map(function(s,i){return {t:(i+1)+". "+s,i:i}})}
  function drawPal(q){
    q=(q||"").toLowerCase();sel=0;
    var f=items().filter(function(o){return o.t.toLowerCase().indexOf(q)>-1});
    window._palF=f;
    lst.innerHTML=f.map(function(o,j){return '<button class="p-it'+(j===0?' sel':'')+'" data-i="'+o.i+'"><small>ETAPE '+(o.i+1)+'</small> '+o.t.split(". ")[1]+'</button>'}).join("")||'<div style="padding:16px;color:var(--muted);font:12px var(--mono)">Aucune etape</div>';
  }
  function markPal(){
    var f=lst.querySelectorAll(".p-it");
    for(var j=0;j<f.length;j++){if(j===sel)f[j].classList.add("sel");else f[j].classList.remove("sel")}
    if(f[sel]&&f[sel].scrollIntoView)f[sel].scrollIntoView({block:"nearest"});
  }
  function openPal(){drawPal("");pal.classList.add("on");inp.value="";setTimeout(function(){inp.focus()},30)}
  function closePal(){pal.classList.remove("on")}
  document.addEventListener("keydown",function(e){
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if(pal.classList.contains("on"))closePal();else openPal()}
    if(e.key==="Escape")closePal();
  });
  inp.addEventListener("input",function(){drawPal(inp.value)});
  inp.addEventListener("keydown",function(e){
    var n=(window._palF||[]).length;
    if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(sel+1,n-1);markPal()}
    else if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(sel-1,0);markPal()}
    else if(e.key==="Enter"){e.preventDefault();var f=window._palF||[];if(f[sel]){closePal();go(f[sel].i)}}
  });
  lst.addEventListener("click",function(e){var t=e.target.closest?e.target.closest(".p-it"):null;if(t){closePal();go(parseInt(t.getAttribute("data-i"),10))}});
  pal.addEventListener("click",function(e){if(e.target===pal)closePal()});
})();
